# LabControl Web \u00e2\u0080\u0094 configura\u00c3\u00a7\u00c3\u00a3o da aplica\u00c3\u00a7\u00c3\u00a3o
#
# Reaproveita a mesma base de dados 'labcontrol' j\u00c3\u00a1 usada nas Etapas
# 6/7 (script UC_15_Etapa6.sql), sem alterar a estrutura das tabelas
# usuarios/equipamentos. Ajuste usuario/senha conforme seu MySQL local.

spring.application.name=LabControl Web

spring.datasource.url=jdbc:mysql://localhost:3306/labcontrol?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yETehCLWp4EW3!K
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 'update' preserva os dados existentes (inseridos pelo script SQL das
# etapas anteriores) e apenas ajusta o schema se necess\u00c3\u00a1rio \u00e2\u0080\u0094 por
# exemplo, ao acrescentar o novo valor MANUTENCAO ao status, nenhuma
# coluna precisa mudar, ent\u00c3\u00a3o isto raramente altera algo em produ\u00c3\u00a7\u00c3\u00a3o.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m

logging.level.br.com.labcontrol=DEBUG
